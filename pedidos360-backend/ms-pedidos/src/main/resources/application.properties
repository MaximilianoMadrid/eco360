spring.application.name=ms-pedidos

# Puerto de ms-pedidos (el mismo que ya usabas en EC2 y en API Gateway).
server.port=8888

# Issuer de tu User Pool de Cognito (valida firma, expiracion e issuer del JWT).
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_IxZrBeOoF

# Base H2 en archivo: los datos sobreviven a un reinicio del JAR si lo ejecutas siempre desde la misma carpeta
# (crea ./data/pedidosdb.mv.db). Para empezar de cero, borra la carpeta data.
spring.datasource.url=jdbc:h2:file:./data/pedidosdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Direccion de ms-inventario. Ambos corren en la misma EC2, por eso localhost:8889.
eco360.inventario.base-url=http://localhost:8889

# Origen permitido por CORS (el Angular local).
eco360.cors.allowed-origin=http://localhost:4200

# ==========================================
# RABBITMQ - Mensajeria asincrona Eco360
# ==========================================

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:eco360}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:eco360}

# Confirmacion manual de mensajes RabbitMQ
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1
