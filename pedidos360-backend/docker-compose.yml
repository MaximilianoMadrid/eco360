services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: eco360-rabbitmq
    hostname: eco360-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: eco360
      RABBITMQ_DEFAULT_PASS: eco360
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  rabbitmq_data:
