spring.application.name=ms-inventario

# Puerto del microservicio de inventario (ms-pedidos usa 8888).
server.port=8889

# Mismo User Pool de Cognito que ms-pedidos: cada microservicio valida por su cuenta el JWT.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_IxZrBeOoF

# Base H2 en archivo: los datos sobreviven a un reinicio del JAR si lo ejecutas siempre desde la misma carpeta
# (crea ./data/inventariodb.mv.db). Para empezar de cero, borra la carpeta data.
spring.datasource.url=jdbc:h2:file:./data/inventariodb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Origen permitido por CORS (el Angular local).
eco360.cors.allowed-origin=http://localhost:4200
